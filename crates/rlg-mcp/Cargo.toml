[package]
name = "rlg-mcp"
version = "0.0.13"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
description = """
Model Context Protocol (MCP) server exposing rlg log streams as tools
to LLM agents (Claude Desktop, Cursor, mcp.run). Tools: `tail_log`,
`filter_log`, `summarize_errors`, `tail_logs_glob`. Speaks MCP over
stdio, streamable HTTP or the older HTTP+SSE transport.
"""
repository = "https://github.com/sebastienrousseau/rlg"
homepage = "https://rustlogs.com/"
documentation = "https://docs.rs/rlg-mcp"
readme = "README.md"
keywords = ["mcp", "log", "agent", "rlg", "anthropic"]
categories = ["command-line-utilities", "development-tools::debugging"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
include = [
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[lib]
name = "rlg_mcp"
path = "src/lib.rs"

[[bin]]
name = "rlg-mcp"
path = "src/main.rs"

[[bench]]
name = "tail"
harness = false
path = "benches/tail.rs"

[[example]]
name = "library_mode"
path = "examples/library_mode.rs"

[[example]]
name = "serve_a_session"
path = "examples/serve_a_session.rs"

[dependencies]
rlg = { version = "0.0.13", path = "../rlg" }
rlg-cli = { version = "0.0.13", path = "../rlg-cli" }
# The official MCP SDK: protocol revisions 2024-11-05 through
# 2026-07-28, stdio and streamable HTTP. The legacy HTTP+SSE bridge in
# src/transport.rs is the only protocol code left in this crate.
rmcp = { version = "3.4", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
glob = "0.3"

[dev-dependencies]
criterion = "0.8"
tempfile = "3"
# The client half of the SDK, so tests and the example can hold a real
# session against the server through an in-memory pipe.
rmcp = { version = "3.4", features = ["client"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints.rust]
missing_copy_implementations = "warn"
missing_docs = "deny"
unsafe_code = "deny"
unused_extern_crates = "warn"
missing_debug_implementations = "forbid"
non_ascii_idents = "forbid"
unreachable_pub = "forbid"
dead_code = "deny"

[package.metadata.docs.rs]
all-features = true
