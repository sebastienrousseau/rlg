name: Fuzz Smoke

# Runs on every pull request, on every push to main, and on demand.
#
# Each of the five targets (fuzz/fuzz_targets/) gets its own job:
#
#   1. Corpus replay: where fuzz/corpus/<target>/ is committed, every
#      input in it is run once (`-runs=0`), so a regression on a
#      known input fails the job.
#   2. Smoke: the target fuzzes for a bounded time (30 s on pull
#      requests and pushes; the `duration` input on a manual run).
#
# A manual run can pick one target. Deep, continuous fuzzing with
# sanitizers is OSS-Fuzz's job (see `docs/OSS-FUZZ.md`); Miri covers
# UB detection on every PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Fuzz target to run (one of: parse_record, log_format_from_str, config_load, redact_scrub, render_one_line, or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - parse_record
          - log_format_from_str
          - config_load
          - redact_scrub
          - render_one_line
      duration:
        description: "Seconds per target"
        required: true
        default: "30"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: cargo-fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_record
          - log_format_from_str
          - config_load
          - redact_scrub
          - render_one_line
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # `rust-src` is required because cargo-fuzz builds with
      # `-Zbuild-std` to recompile `std` against the sanitizer
      # runtime.
      - name: Install nightly toolchain with rust-src
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: fuzz-smoke
          workspaces: fuzz -> target
          cache-on-failure: true

      # `--target` is explicit: cargo-fuzz defaults to the target it was
      # itself built for, and install-action's prebuilt binary is musl,
      # which the nightly toolchain here has no `core` for.
      # `--sanitizer none` disables the ASan runtime for the CI smoke
      # gate. The smoke gate's job is to catch panics and hangs in a
      # bounded window, which it does without ASan, and it avoids the
      # GHA Ubuntu incompatibility between libFuzzer's sanitizer
      # runtime and statically-linked libc. Deep UB detection happens
      # through Miri on every PR and OSS-Fuzz's ASan / MSan / UBSan
      # runs. A crash lands as `fuzz/artifacts/<target>/crash-*`,
      # which the job uploads so it can be reproduced locally.
      - name: Replay the committed ${{ matrix.target }} corpus
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -d "corpus/${TARGET}" ]; then
            cargo +nightly fuzz run --sanitizer none --target x86_64-unknown-linux-gnu "${TARGET}" "corpus/${TARGET}" -- -runs=0
          else
            echo "no committed corpus for ${TARGET}; nothing to replay"
          fi

      - name: Fuzz ${{ matrix.target }} for a bounded time
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          DURATION: ${{ inputs.duration || '30' }}
        run: |
          case "${DURATION}" in
            ''|*[!0-9]*) echo "duration must be a whole number of seconds"; exit 1 ;;
          esac
          cargo +nightly fuzz run --sanitizer none --target x86_64-unknown-linux-gnu "${TARGET}" \
            -- -max_total_time="${DURATION}" -print_final_stats=1

      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
