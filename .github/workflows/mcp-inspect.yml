name: MCP Protocol Conformance

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "crates/rlg-mcp/**"
      - "crates/rlg/**"
      - "crates/rlg-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/rlg-mcp/**"
      - "crates/rlg/**"
      - "crates/rlg-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target-mcp-inspect"
          key: mcp-inspect

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Build rlg-mcp (release)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-mcp-inspect
        run: cargo build --release -p rlg-mcp

      - name: List tools via MCP Inspector CLI
        run: |
          BIN="${{ github.workspace }}/target-mcp-inspect/release/rlg-mcp"
          npx -y @modelcontextprotocol/inspector --cli "$BIN" --method tools/list
