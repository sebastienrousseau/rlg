name: MCP Protocol Conformance

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "crates/rlg-mcp/**"
      - "crates/rlg/**"
      - "crates/rlg-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/rlg-mcp/**"
      - "crates/rlg/**"
      - "crates/rlg-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-mcp-inspect"
          key: mcp-inspect

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Build rlg-mcp (release)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-mcp-inspect
        run: cargo build --release -p rlg-mcp

      - name: List tools via MCP Inspector CLI
        run: |
          BIN="${{ github.workspace }}/target-mcp-inspect/release/rlg-mcp"
          npx -y @modelcontextprotocol/inspector --cli "$BIN" --method tools/list
