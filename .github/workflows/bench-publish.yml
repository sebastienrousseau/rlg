name: Bench Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: bench-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    name: cargo criterion
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-criterion

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: bench-publish
          cache-on-failure: true

      # cargo-criterion emits HTML reports under target/criterion.
      # These reports are the artefact promised at
      # rustlogs.com/bench/<tag>/. Publication to the site is
      # handled out-of-band by the maintainer (site build pipeline
      # not in this repo).
      - name: Run every workspace bench
        env:
          RLG_FALLBACK_STDOUT: "1"
        run: |
          set -euo pipefail
          # Nothing is built before this step, so target/ does not exist
          # yet; without it every redirect below fails before cargo runs.
          mkdir -p target
          for manifest in crates/*/Cargo.toml; do
            crate="$(basename "$(dirname "$manifest")")"
            # xtask has no benches; skip.
            [ "$crate" = "xtask" ] && continue
            # Some crates may have no [[bench]] entries — skip
            # silently.
            if ! grep -q '\[\[bench\]\]' "$manifest"; then
              continue
            fi
            echo "::group::${crate}: cargo criterion"
            cargo criterion --manifest-path "$manifest" \
              --message-format=json > "target/criterion-${crate}.jsonl" \
              || echo "::warning::${crate} bench failed — non-fatal on publish"
            echo "::endgroup::"
          done

      # Artifact names may not contain "/", which a branch name can
      # (feat/v0.0.13); a tag like v0.0.13 is unchanged.
      - name: Name the artifacts after the ref
        id: ref
        run: echo "name=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload Criterion HTML report bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: criterion-${{ steps.ref.outputs.name }}
          path: target/criterion/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload machine-readable summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: criterion-summary-${{ steps.ref.outputs.name }}
          path: target/criterion-*.jsonl
          if-no-files-found: warn
          retention-days: 90
