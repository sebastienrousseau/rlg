name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  # Lets an existing tag be re-released without deleting and re-pushing
  # it. A GitHub Actions incident once left a tag-triggered run wedged --
  # reported queued, completed and running at once, refusing both cancel
  # and rerun -- and the only recovery was moving the tag, which is how
  # a release gets published from the wrong commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.0.13 (required unless dry_run)"
        required: false
        type: string
      dry_run:
        description: "Build and attest the binaries from this ref; publish nothing"
        required: false
        type: boolean
        default: false

env:
  # Single source of truth for the tag being released. On a dispatch
  # github.ref_name is the branch the run started from, not the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

# Every publishable crate in the workspace. Lockstep versions —
# every entry must match the tag's version.
#
# `xtask` is excluded (publish = false).
#
# Order matters for the publish step:
#   1. `rlg` first  — every other crate depends on it.
#   2. `rlg-cli` second — `rlg-mcp` and `rlg-report` depend on it.
#   3. The rest can publish independently of one another.

jobs:
  # ─── Verify ────────────────────────────────────────────────────────
  validate:
    name: Validate tag matches crate versions
    # A dry run publishes nothing: skipping this skips every job that
    # needs it (ci, publish, github-release, binaries-release).
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check tag matches every publishable crate
        run: |
          TAG="${RELEASE_TAG#v}"
          for crate in \
              rlg \
              rlg-cli \
              rlg-ebpf \
              rlg-mcp \
              rlg-otlp \
              rlg-redact \
              rlg-report \
              rlg-test \
              rlg-tower \
              rlg-wasm; do
            CRATE_VERSION=$(
              grep '^version' "crates/${crate}/Cargo.toml" \
                | head -1 | sed 's/.*"\(.*\)"/\1/'
            )
            echo "${crate}: ${CRATE_VERSION} (tag: ${TAG})"
            if [ "$CRATE_VERSION" != "$TAG" ]; then
              echo "::error::${crate} version (${CRATE_VERSION}) does not match tag (${TAG})"
              exit 1
            fi
          done

  # ─── CI gate ───────────────────────────────────────────────────────
  ci:
    name: Re-run CI on the tagged ref
    needs: [validate]
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@main
    with:
      rust-version: 'stable'

  # ─── Publish to crates.io ──────────────────────────────────────────
  publish:
    name: Publish workspace to crates.io
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Mints the OIDC token crates.io exchanges for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Idempotent publish: each crate is checked against the live
      # crates.io index first; if `<crate>@<version>` is already
      # published, the step logs a notice and skips. This makes
      # `gh run rerun --failed` safe after a partial-publish failure
      # (e.g. token rotation mid-release): re-running won't error on
      # the crates that already landed.
      #
      # Dependency-order, with sparse-index sleeps after the two
      # crates other workspace members depend on:
      #
      #   rlg
      #   ├── rlg-cli ─── rlg-mcp
      #   │             └─ rlg-report
      #   ├── rlg-otlp
      #   ├── rlg-redact
      #   ├── rlg-test
      #   ├── rlg-tower
      #   └── rlg-wasm
      # Trusted publishing: swaps this job's GitHub OIDC identity for a
      # temporary crates.io token, revoked by the action's post step when
      # the job ends. The config is per crate, so every crate this step
      # walks needs its own trusted publisher on crates.io -- all ten of
      # them, each pointing at this repository and release.yml.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace (idempotent, dependency-ordered)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          # publish_or_skip <crate> [sparse_index_sleep_seconds]
          #
          # Returns 0 if the crate@VERSION is already on crates.io
          # (we log and skip) or if `cargo publish` succeeds.
          # Propagates failure on a real publish error.
          publish_or_skip() {
            local crate="$1"
            local sleep_after="${2:-0}"
            local url="https://crates.io/api/v1/crates/${crate}/${VERSION}"
            if curl -sf -o /dev/null "${url}"; then
              echo "::notice::${crate} ${VERSION} already on crates.io — skipping"
              return 0
            fi
            echo "::group::Publish ${crate} ${VERSION}"
            cargo publish --package "${crate}" --locked
            echo "::endgroup::"
            if [ "${sleep_after}" -gt 0 ]; then
              echo "Waiting ${sleep_after}s for sparse-index propagation…"
              sleep "${sleep_after}"
            fi
          }

          # 1. rlg first — every other workspace crate depends on it.
          publish_or_skip rlg 30
          # 2. rlg-cli second — rlg-mcp and rlg-report depend on it.
          publish_or_skip rlg-cli 30
          # 3. Independent of one another; only depend on `rlg`.
          publish_or_skip rlg-ebpf
          publish_or_skip rlg-otlp
          publish_or_skip rlg-redact
          publish_or_skip rlg-test
          publish_or_skip rlg-tower
          publish_or_skip rlg-wasm
          # 4. Depend on `rlg` + `rlg-cli` — by now the sparse
          #    index has had 30s + N publish-roundtrips to catch
          #    both, so no further sleep needed.
          publish_or_skip rlg-mcp
          publish_or_skip rlg-report

  # ─── GitHub Release ────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      # ─── SBOMs (SPDX + CycloneDX) ──────────────────────────────
      # Two formats because:
      # - SPDX is the OSS default consumers expect;
      # - CycloneDX is the EU Cyber Resilience Act (CRA) baseline
      #   most enterprise procurement RFPs will demand from 2026 on.

      - name: Generate workspace SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          # Signed copies are attached below; the action's own
          # unsigned upload would duplicate them on the release.
          upload-release-assets: false

      - name: Generate workspace SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # Signed copies are attached below; the action's own
          # unsigned upload would duplicate them on the release.
          upload-release-assets: false

      # ─── Sigstore / cosign signatures ───────────────────────────
      # Keyless signing via GitHub Actions OIDC. No maintainer key
      # material stored anywhere — the workflow's `id-token: write`
      # permission is the trust anchor. Signature + certificate
      # bundles land alongside the SBOMs on the release page.
      #
      # Consumers verify with:
      #   cosign verify-blob \
      #     --certificate sbom.spdx.json.crt \
      #     --signature sbom.spdx.json.sig \
      #     --certificate-identity-regexp 'https://github.com/sebastienrousseau/rlg/.github/workflows/release.yml@refs/tags/v[0-9]+.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     sbom.spdx.json
      #
      # See `pkg/VERIFY.md` for the full consumer runbook.

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOMs with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for f in sbom.spdx.json sbom.cyclonedx.json; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.crt" \
              "$f"
          done

      - name: Attach SBOMs + signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            sbom.spdx.json \
            sbom.spdx.json.sig \
            sbom.spdx.json.crt \
            sbom.cyclonedx.json \
            sbom.cyclonedx.json.sig \
            sbom.cyclonedx.json.crt \
            --clobber

  # ─── Binaries ──────────────────────────────────────────────────────
  # Pre-built rlg, rlg-report and rlg-mcp for every primary platform,
  # musl-static on Linux. Each archive carries the binaries, their
  # generated manpages and completions, and the licences, and gets a
  # SLSA build-provenance attestation. Runs on dry runs too, from the
  # dispatched ref, so new release machinery is exercised before a tag.
  binaries:
    name: Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install the target
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            sudo apt-get update -q && sudo apt-get install -yq musl-tools
          fi
      - name: Build
        shell: bash
        run: >
          cargo build --release --locked --target "${{ matrix.target }}"
          -p rlg-cli -p rlg-report -p rlg-mcp
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/rlg/Cargo.toml | head -1)
          name="rlg-${version}-${{ matrix.target }}"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p "$name/man" "$name/completions"
          for bin in rlg rlg-report rlg-mcp; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "$name/"
          done
          # Manpages and completions come from a host build of the CLIs.
          for bin in rlg rlg-report; do
            pkg=$([ "$bin" = rlg ] && echo rlg-cli || echo rlg-report)
            cargo run -q --release --locked -p "$pkg" -- --manpage > "$name/man/$bin.1"
            for shell in bash zsh fish powershell; do
              cargo run -q --release --locked -p "$pkg" -- --completions "$shell" \
                > "$name/completions/$bin.$shell"
            done
          done
          cp LICENSE-APACHE LICENSE-MIT README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Check a Linux binary is static
        if: contains(matrix.target, 'musl')
        run: |
          file "target/${{ matrix.target }}/release/rlg"
          # Rust's musl targets link static-pie; `file` says so.
          file "target/${{ matrix.target }}/release/rlg" | grep -Eq 'static(ally|-pie) linked'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  binaries-release:
    name: Attach binaries and SHA256SUMS
    needs: [binaries, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum rlg-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${RELEASE_TAG}" rlg-* SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --clobber

      # The release page in the portfolio format (AGENTS.md §3): title
      # `rlg <VERSION>`, the hand-written Highlights from
      # docs/releases/, GitHub's generated What's Changed, SHA-256 of
      # every asset (binaries, SBOMs, signatures), and the compare link.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          path: src
          persist-credentials: false
      - name: Compose the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p all
          gh release download "${RELEASE_TAG}" --dir all --clobber
          cd src
          previous=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^")
          scripts/compose-release-notes.sh "${RELEASE_TAG}" "$previous" ../all > ../notes.md
          gh release edit "${RELEASE_TAG}" --title "rlg ${RELEASE_TAG#v}" \
            --notes-file ../notes.md

