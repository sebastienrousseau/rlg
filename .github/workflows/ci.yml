name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@main
    with:
      rust-version: 'stable'
      run-coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    uses: sebastienrousseau/pipelines/.github/workflows/security.yml@main
    with:
      language: rust

  docs:
    if: github.ref == 'refs/heads/main'
    uses: sebastienrousseau/pipelines/.github/workflows/docs.yml@main
    with:
      type: rust
      redirect-crate: rlg

  # The shared security workflow runs `cargo deny check` with
  # `continue-on-error: true`, so a policy violation there never
  # fails the build. This job is the enforcing gate for deny.toml.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action's default arguments are --all-features, so every
      # optional dependency is held to deny.toml too.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Per-function and per-file complexity ceilings, held against the
  # committed baseline in scripts/complexity-baseline.json: no new
  # offenders, and no baselined offender may get worse.
  complexity:
    name: Complexity ceilings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version the baseline was measured with; bump both together.
      - uses: taiki-e/install-action@v2.87.15
        with:
          tool: rust-code-analysis-cli@0.0.25
      - run: scripts/complexity-gate.py

  mcp-manifests:
    name: MCP manifests name the shipped version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-mcp-manifests.sh
