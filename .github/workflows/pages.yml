name: GitHub Pages

# Publishes `cargo doc` for every workspace crate, and the mdBook user
# manual under /manual/, to https://doc.rustlogs.com/. Fires on every push to
# main, so the site tracks HEAD. Release tags are not a trigger: a tag
# points at a merge commit main has already deployed, and the
# github-pages environment only accepts deployments from main.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deploy at a time; a newer run cancels an in-flight
# older one.
concurrency:
  group: pages
  cancel-in-progress: false

# Read-only by default; only the deploy job can publish.
permissions:
  contents: read

jobs:
  build:
    name: Build cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Nightly gives us `#[doc(cfg(feature = "…"))]` rendering,
      # which several workspace crates use to annotate feature-gated
      # items. The `RUSTDOCFLAGS --cfg docsrs` combo mirrors what
      # docs.rs does.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: pages

      - name: Build workspace docs
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: |
          cargo doc \
            --workspace \
            --all-features \
            --no-deps

      # Root redirect — GH Pages lands on `/`, but there's no `/index.html`
      # under `target/doc` (only per-crate directories). Redirect to
      # `/rlg/` so visitors reach the flagship crate's docs.
      - name: Add root redirect to rlg
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=rlg/">
          <link rel="canonical" href="rlg/">
          <title>rlg — RustLogs</title>
          <p>Redirecting to <a href="rlg/">rlg documentation</a>.</p>
          HTML

      # The user manual, built with mdBook from `docs/`, served at
      # /manual/ beside the API reference.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: mdbook@0.5.4
      - name: Build the user manual
        run: mdbook build --dest-dir target/doc/manual

      # A `.nojekyll` file tells GH Pages to serve the tree
      # verbatim — otherwise underscored directories (like
      # `_static`, `_images`) are hidden.
      - name: Disable Jekyll
        run: touch target/doc/.nojekyll

      # A `CNAME` file in the deployed artifact tells GH Pages to
      # serve at the custom domain. Without this, each new deploy
      # would drop the `doc.rustlogs.com` binding and the site would
      # fall back to `sebastienrousseau.github.io/rlg/`.
      - name: Write CNAME for the custom domain
        run: echo "doc.rustlogs.com" > target/doc/CNAME

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
