name: cargo-vet

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "supply-chain/**"
      - ".github/workflows/cargo-vet.yml"
  push:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vet:
    name: cargo vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Pin cargo-vet to the version that generated our
      # supply-chain/imports.lock. Bytecode Alliance's audits use
      # the `trusted-publisher` field (cargo-vet 0.10+), which
      # earlier cargo-vet releases reject with "missing field
      # `user-id`".
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-vet@0.10.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: cargo-vet
          cache-on-failure: true

      - name: Run cargo vet
        run: cargo vet --locked
