version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # parking_lot 0.13 needs rustc 1.95, above the 1.89 MSRV. Lift
    # this when the MSRV moves to 1.95 or later.
    ignore:
      - dependency-name: "parking_lot"
        versions: [">=0.13"]
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
  # Base images are pinned by digest (OpenSSF Scorecard
  # Pinned-Dependencies); these keep the digests current.
  - package-ecosystem: docker
    directories: ["/", "/pkg/docker"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"
